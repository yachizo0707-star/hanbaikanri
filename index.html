<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="登録販売者 正誤">
<title>登録販売者 正誤トレーニング(千葉)</title>
<style>
:root{
  --bg:#f3f6f5; --card:#fff; --ink:#1f2d2b; --sub:#5e6e6b; --line:#dbe4e2;
  --accent:#1f8a7a; --accent-d:#17695d; --ok:#1f8a4c; --ok-bg:#e6f5ec; --ng:#c0392b; --ng-bg:#fbeceb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
h1{font-size:20px;margin:6px 0 2px;line-height:1.3}
.lead{font-size:12.5px;color:var(--sub);margin:0 0 14px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.sub{color:var(--sub);font-size:12.5px}
.big{font-size:26px;font-weight:700}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.btn{display:block;width:100%;min-height:50px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:12px;margin-top:10px}
.btn:active{background:var(--accent-d)}
.btn.ghost{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
.btn.gray{background:#e9efee;color:var(--ink)}
.btn[disabled]{opacity:.4;pointer-events:none}
.subj{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,#999);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.subj .nm{font-weight:700;font-size:15.5px}
.bar{height:8px;border-radius:5px;background:#e6ecea;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:#e8f1ef;color:var(--accent-d);font-weight:600}
.xbtn{background:#e9efee;border-radius:10px;min-height:38px;padding:0 12px;font-size:14px}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.q-text{font-size:18px;line-height:1.75;margin:0 0 16px;font-weight:500}
.ans{display:flex;gap:12px}
.ans button{flex:1;min-height:76px;border-radius:14px;font-size:20px;font-weight:800;background:#fff;border:2px solid var(--line)}
.ans button small{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-top:2px}
.ans button.pick{border-color:var(--accent);background:#e8f4f1}
.ans button.right{border-color:var(--ok);background:var(--ok-bg)}
.ans button.wrong{border-color:var(--ng);background:var(--ng-bg)}
.ans button[disabled]{pointer-events:none}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;line-height:1.75;font-size:15px}
.fb.ok{background:var(--ok-bg);border:1px solid #b6e0c6}
.fb.ng{background:var(--ng-bg);border:1px solid #efc3be}
.fb b.h{display:block;font-size:17px;margin-bottom:4px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:var(--ng)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:600;font-size:12px}
.rev{border-top:1px solid var(--line);padding:12px 0;line-height:1.7;font-size:14.5px}
.rev:first-child{border-top:0}
.rev .a{font-size:13px;color:var(--sub)}
.tag-ok{color:var(--ok);font-weight:700}.tag-ng{color:var(--ng);font-weight:700}
.modal{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:24px}
.modal.on{display:flex}
.box{background:#fff;border-radius:16px;padding:20px 18px;max-width:380px;width:100%;line-height:1.7}
.box .t{font-weight:700;font-size:17px;margin-bottom:6px}
.box .bs{display:flex;gap:10px;margin-top:14px}
.box .bs .btn{margin-top:0}
.pill.hot{background:#fff3d6;color:#9a6a00}
.pill.warm{background:#f4f1e6;color:#7a6a2a}
.note{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
// 登録販売者(千葉ブロック) 正誤問題データ
// [科目ID, 論点, 問題文, 正解(1=正しい,0=誤り), 解説]
const SUBJECTS = [
  { id: 'kihon',  name: '医薬品に共通する特性と基本的な知識', short: '基本知識',   exam: 20, color: '#2a9d8f' },
  { id: 'jintai', name: '人体の働きと医薬品',                 short: '人体',       exam: 20, color: '#457b9d' },
  { id: 'houki',  name: '薬事に関する法規と制度',             short: '法規',       exam: 20, color: '#8d6cab' },
  { id: 'iyaku',  name: '主な医薬品とその作用',               short: '医薬品',     exam: 40, color: '#e07a5f' },
  { id: 'tekisei',name: '医薬品の適正使用と安全対策',         short: '適正使用',   exam: 20, color: '#d4a017' }
];

const RAW = [
// ===== 基本的な知識 =====
['kihon','医薬品の本質','医薬品は、有効性や安全性が確認されたものであっても、人体にとって本来異物であるため、使い方次第でリスクを伴う。',1,'医薬品は生命関連製品ですが、人体にとっては本来異物です。承認された医薬品でも、副作用などのリスクをゼロにはできません。'],
['kihon','リスク評価','医薬品の毒性の指標のひとつである50%致死量(LD50)は、動物実験によって求められる。',1,'LD50は、投与した動物の半数が死亡する量のことで、動物実験で求めます。'],
['kihon','リスク評価','ヒトを対象とした臨床試験の実施の基準は、GLPとして定められている。',0,'臨床試験の基準はGCPです。GLPは、動物実験など医薬品の安全性に関する非臨床試験の基準です。'],
['kihon','健康食品','機能性表示食品は、国が個別に審査を行い、許可を与えた食品である。',0,'機能性表示食品は、事業者が科学的根拠を示して消費者庁長官に届け出る制度です。国が個別に許可するのは特定保健用食品です。'],
['kihon','アレルギー','アレルギーは、医薬品の薬理作用が弱い少量でも起こることがあり、有効成分だけでなく添加物が原因となることもある。',1,'アレルギーは薬理作用とは関係なく起こり、少量でも発症することがあります。添加物がアレルゲンになる場合もあります。'],
['kihon','アレルギー','医薬品によるアレルギーは、その医薬品を初めて使用したときにのみ起こり、2回目以降は起こらない。',0,'以前に使って問題がなかった医薬品でも、あとからアレルギーが起こることがあります。'],
['kihon','副作用','WHOの定義では、副作用とは、疾病の予防・診断・治療などのため人に通常用いられる量で発現する、医薬品の有害かつ意図しない反応をいう。',1,'「通常用いられる量で」「有害かつ意図しない反応」という点がポイントです。'],
['kihon','副作用','一般用医薬品は軽度な症状に用いるものなので、重篤な副作用は起こらない。',0,'一般用医薬品でも、ショックや皮膚粘膜眼症候群など、生命に関わる重篤な副作用が起こることがあります。'],
['kihon','不適正な使用','一般用医薬品は医療用医薬品より作用が穏やかなので、乱用を繰り返しても薬物依存は生じない。',0,'一般用医薬品でも乱用を繰り返すと薬物依存が生じることがあります。購入者の状況を確認することが大切です。'],
['kihon','年齢区分','乳児とは、生後4週以上、1歳未満の者をいう。',1,'新生児は生後4週未満、乳児は4週以上1歳未満、幼児は1歳以上7歳未満、小児は7歳以上15歳未満です。'],
['kihon','年齢区分','幼児とは、満3歳以上7歳未満の者をいう。',0,'幼児は満1歳以上7歳未満です。'],
['kihon','小児等','小児は、大人と比べて身体の大きさに対して腸が短く、服用した医薬品の吸収率が相対的に低い。',0,'小児は身体の大きさに対して腸が長く、医薬品の吸収率が相対的に高くなります。'],
['kihon','高齢者','高齢者は、医薬品の作用が強く現れたり、副作用を生じやすかったりするため、若年者と同じ用量で使うときは注意が必要である。',1,'高齢者は、肝臓や腎臓の働きが低下していることが多く、医薬品の作用や副作用が強く出ることがあります。'],
['kihon','妊婦等','胎盤は、母体の血液中の医薬品成分が胎児へ移行しないよう完全に遮るため、妊婦が服用した医薬品が胎児に影響することはない。',0,'胎盤には関所の役割がありますが、医薬品の成分が胎児へ移行することがあります。'],
['kihon','プラセボ効果','プラセボ効果とは、薬理作用によらず、思い込み等で生じる効果であり、好ましくない反応(副作用のようなもの)が現れることもある。',1,'プラセボ効果は不確実なもので、効果だけでなく、好ましくない反応が現れる場合もあります。'],
['kihon','医薬品の品質','医薬品の使用期限は、開封後でも期限まで品質が保たれることを保証するものである。',0,'使用期限は、未開封で適切に保管された場合に品質が保持される期限です。開封後は劣化が早まります。'],
['kihon','販売時コミュニケーション','購入者が自分の症状を正確に伝えられるとは限らないため、登録販売者の側から必要な情報を引き出す工夫が必要である。',1,'購入者が不安や遠慮から情報を伝えきれないことがあるため、こちらから状況を聞き出す姿勢が求められます。'],
['kihon','サリドマイド','サリドマイドの光学異性体のうち、催奇形性のない一方だけを分離して製剤化すれば、催奇形性を避けることができる。',0,'サリドマイドは、体内で異性体どうしが相互に変換されるため、一方だけを分離しても催奇形性を避けられません。'],
['kihon','スモン','スモン訴訟は、整腸剤キノホルム製剤の使用により、亜急性脊髄視神経症が発生したことに対する訴訟である。',1,'スモンは、キノホルム製剤による亜急性脊髄視神経症で、下肢の麻痺や視覚障害などが現れます。'],
['kihon','HIV・CJD訴訟','CJD訴訟は、ウイルスが混入した血液凝固因子製剤が原因で提起された訴訟である。',0,'ウイルスが混入した血液製剤は、HIV訴訟です。CJD訴訟は、プリオンに汚染されたヒト乾燥硬膜の使用が原因です。'],
['kihon','薬害訴訟','サリドマイド訴訟やスモン訴訟を契機として、医薬品副作用被害救済制度が創設された。',1,'薬害を受けた方々を救済する仕組みとして、医薬品副作用被害救済制度が創設されました。'],

// ===== 人体の働きと医薬品 =====
['jintai','消化器系','胃液に含まれるペプシノーゲンは、胃酸によってペプシンに変わり、タンパク質の消化にはたらく。',1,'ペプシノーゲンは胃酸の作用でペプシンになり、タンパク質を分解します。'],
['jintai','消化器系','栄養分の吸収は、大部分が大腸で行われる。',0,'栄養分の吸収の大部分は小腸で行われます。大腸は主に水分やミネラルの吸収と、便の形成を担います。'],
['jintai','消化器系','膵液は強酸性で、胃から送られた内容物の酸性を強める。',0,'膵液は弱アルカリ性で、胃で酸性になった内容物を中和します。'],
['jintai','肝臓と胆嚢','胆汁は胆嚢で産生される。',0,'胆汁は肝臓で産生されます。胆嚢は胆汁を貯蔵し、濃縮する器官です。'],
['jintai','肝臓と胆嚢','ビリルビンは、赤血球中のヘモグロビンが分解されて生じる黄色の色素で、胆汁の成分として排泄される。',1,'ビリルビンが胆汁中へ排出されず血液中に滞留すると、黄疸が現れます。'],
['jintai','呼吸器系','肺には筋肉がないため、自力で膨らんだり縮んだりすることはできず、横隔膜や肋間筋の働きで呼吸運動が行われる。',1,'肺そのものは自力で動けず、横隔膜や肋間筋の動きによって空気が出入りします。'],
['jintai','循環器系','右心室から送り出された血液は、大動脈を通って全身に運ばれる。',0,'右心室から出た血液は肺動脈を通って肺へ向かいます。全身へ送り出すのは左心室(大動脈)です。'],
['jintai','血液及びリンパ系','白血球のうち好中球は最も数が多く、全体の約6割を占める。',1,'好中球は、細菌などを食べて処理する働きをもつ白血球で、白血球の中で最も数が多い成分です。'],
['jintai','血液及びリンパ系','血小板は、赤血球とともに、全身に酸素を運搬する役割を担っている。',0,'酸素を運搬するのは赤血球です。血小板は出血時に血液を固める(止血する)働きをします。'],
['jintai','泌尿器系','男性の尿道は女性よりも短いため、膀胱炎は男性に多い。',0,'女性の尿道のほうが短く、細菌が侵入しやすいため、膀胱炎は女性に多くみられます。'],
['jintai','泌尿器系','副腎皮質ホルモンのひとつであるアルドステロンは、体内に塩分と水を貯留し、カリウムの排泄を促す。',1,'アルドステロンは、腎臓で塩分(ナトリウム)と水の再吸収を促し、カリウムの排泄を促します。'],
['jintai','目','水晶体は、毛様体の働きによって厚みが調節され、遠近の焦点を合わせる。',1,'水晶体の厚みは、毛様体の収縮・弛緩によって変化し、ピントの調節が行われます。'],
['jintai','目','角膜には血管が通っており、血液から直接栄養を受けている。',0,'角膜には血管がなく、房水によって栄養や酸素が供給されます。'],
['jintai','鼻及び耳','小児は大人に比べて耳管が短く太く、水平に近いため、鼻腔からの感染が中耳に及びやすい。',1,'小児は耳管の構造上、鼻やのどの感染症から中耳炎を起こしやすくなります。'],
['jintai','外皮系','メラニン色素をつくるメラノサイトは、皮膚の真皮の最下層にある。',0,'メラノサイト(メラニン細胞)は、表皮の最下層にあります。'],
['jintai','骨格系及び筋組織','平滑筋は、自分の意思で動かすことのできる随意筋である。',0,'平滑筋は不随意筋で、自分の意思では動かせません。骨格筋は随意筋(横紋筋)です。'],
['jintai','脳や神経系','交感神経系が活発になると、心臓の拍動は速くなり、消化管の運動は抑制される。',1,'交感神経は「闘争や逃走」の体勢をつくります。心拍数が増え、消化活動は抑えられます。'],
['jintai','代謝・排泄','肝機能が低下している人では、医薬品の成分が代謝されにくく、作用が強く現れることがある。',1,'医薬品の成分の多くは肝臓で代謝されるため、肝機能が低下していると効き目や副作用が強く出ることがあります。'],
['jintai','代謝・排泄','医薬品の成分は、尿中にのみ排泄され、胆汁・呼気・汗・母乳中には排泄されない。',0,'医薬品の成分は、尿のほか、胆汁、呼気、汗、母乳中などにも排泄されます。'],
['jintai','剤形','内服用のカプセル剤を水なしで服用すると、のどや食道に貼り付くおそれがある。',1,'カプセル剤は水とともに服用するのが基本です。水なしでは、食道などに貼り付く危険があります。'],
['jintai','精神神経系の副作用','無菌性髄膜炎は、細菌の感染によって起こる髄膜炎である。',0,'無菌性髄膜炎は、細菌が検出されないことから名づけられた副作用で、医薬品の使用がきっかけで生じます。'],
['jintai','消化器系の副作用','消化性潰瘍は、胃にだけ起こり、十二指腸には起こらない。',0,'消化性潰瘍は、胃や十二指腸の粘膜組織が傷害されて、その一部が粗くなったり、欠損したりする症状です。'],
['jintai','全身的な症状の副作用','皮膚粘膜眼症候群は、高熱を伴って、全身の皮膚や口、眼などの粘膜に、発疹・発赤、やけどのような水疱などの重い症状が現れる副作用である。',1,'皮膚粘膜眼症候群(スティーブンス・ジョンソン症候群)は、重篤な皮膚粘膜障害です。早急に医師の診療を受ける必要があります。'],
['jintai','呼吸器系の副作用','間質性肺炎は、肺胞と毛細血管を取り囲んで支持している組織(間質)が炎症を起こしたもので、息切れや空咳、発熱などが現れる。',1,'間質性肺炎は、医薬品の副作用として起こる重篤な呼吸器系の症状のひとつです。'],

// ===== 薬事に関する法規と制度 =====
['houki','薬機法','薬機法は、医薬品等の品質、有効性、安全性の確保のほか、医療上特にその必要性が高い医薬品等の研究開発の促進のために必要な措置を講ずることも目的としている。',1,'薬機法は、規制だけでなく、必要性の高い医薬品等の研究開発の促進も目的としています。'],
['houki','販売従事登録','登録販売者は、氏名を変更したときは、50日以内にその旨を届け出なければならない。',0,'登録事項に変更が生じた場合は、30日以内に届け出る必要があります。'],
['houki','販売従事登録','登録販売者が店舗管理者になるには、過去5年間のうち、薬剤師・登録販売者の管理・指導のもとで通算2年以上(月80時間以上)の実務経験が必要である。',1,'店舗管理者要件は、過去5年のうち通算2年以上(1か月80時間以上)の実務経験です。'],

['houki','リスク区分','第三類医薬品に分類された医薬品が、その後の調査で副作用の情報が集積され、第二類医薬品に変更されることがある。',1,'リスク区分は、市販後の情報に基づいて見直されることがあります。'],

['tekisei','相談すること','抗コリン作用を持つ成分を含む医薬品では、緑内障の診断を受けた人は、使用前に医師、薬剤師等に相談する。',1,'抗コリン成分は眼圧を上昇させるおそれがあります。緑内障の診断を受けた人は、使用前に相談します。'],
['tekisei','相談すること','眠気を催す成分を含む乗物酔い防止薬を使用したときは、乗物又は機械類の運転操作を避ける。',1,'眠気や注意力低下で、事故につながるおそれがあります。'],
['tekisei','事例問題','購入者が、妊娠中であると伝えてきた場合は、その医薬品が使用可能かを添付文書で確認し、必要に応じて医師や薬剤師への相談を勧める。',1,'妊婦への医薬品使用は、成分によっては胎児への影響があるため、慎重な対応が必要です。'],
['tekisei','安全性情報','緊急安全性情報は、青色の用紙で作成されることから「ブルーレター」とも呼ばれる。',0,'緊急安全性情報は黄色の用紙(イエローレター)です。ブルーレターは安全性速報です。'],
['tekisei','報告制度','医薬品の副作用の報告は、その医薬品との因果関係が明確になった場合に限って行う。',0,'因果関係が明確でなくても、保健衛生上の危害の発生や拡大を防止するために必要と認めるときは、報告の対象になります。'],
['tekisei','報告制度','登録販売者は、医薬品の副作用等を報告する医薬関係者に含まれる。',1,'薬局開設者、医師、薬剤師、登録販売者などが医薬関係者として、副作用等の報告の対象になります。'],
['tekisei','企業報告','製造販売業者は、医薬品による副作用で死亡の症例を知ったときは、その日から15日以内に厚生労働大臣へ報告する。',1,'死亡など重大な事案は、15日以内の報告が求められます。'],
['tekisei','救済制度','医薬品副作用被害救済制度は、医薬品を適正に使用したにもかかわらず、副作用によって一定の健康被害が生じた場合に、医療費などの給付を行う制度である。',1,'適正使用が前提です。医療費、医療手当、障害年金、遺族年金などが給付されます。'],
['tekisei','救済制度','医薬品の用法・用量を守らず、過量に服用して生じた健康被害は、救済制度の給付の対象となる。',0,'医薬品を適正に使用しなかった場合の健康被害は、救済制度の給付の対象になりません。'],

["kihon", "一般用医薬品の定義", "一般用医薬品とは、医薬品のうち、その効能及び効果において人体に対する作用が著しくないものであって、医薬関係者から提供された情報に基づく需要者の選択により使用されることが目的とされているものをいう。", 1, "「作用が著しくない」「情報に基づく需要者の選択」がポイントです。"],

const FREQ = {"医薬品の本質": 4, "リスク評価": 4, "健康食品": 4, "アレルギー": 4, "副作用": 4, "不適正な使用": 4, "年齢区分": 1, "小児等": 4, "高齢者": 4, "妊婦等": 3, "プラセボ効果": 4, "医薬品の品質": 4, "販売時コミュニケーション": 4, "サリドマイド": 4, "スモン": 4, "HIV・CJD訴訟": 4, "薬害訴訟": 4, "セルフメディケーション": 4, "一般用医薬品の定義": 2, "一般用医薬品の選択": 4, "食品との相互作用": 4, "相互作用": 4, "医療機関で治療を受けている人": 4, "消化器系": 4, "肝臓と胆嚢": 2, "呼吸器系": 4, "循環器系": 4, "血液及びリンパ系": 3, "泌尿器系": 3, "目": 4, "鼻及び耳": 3, "外皮系": 3, "骨格系及び筋組織": 3, "脳や神経系": 4, "代謝・排泄": 4, "剤形": 4, "体内での働き": 3, "全身的な症状の副作用": 4, "肝機能障害": 2, "精神神経系の副作用": 2, "消化器系の副作用": 2, "呼吸器系の副作用": 2, "薬機法": 4, "販売従事登録": 3, "医薬品定義": 4, "毒薬・劇薬": 4, "リスク区分": 4, "容器・外箱の記載": 4, "医薬部外品": 4, "化粧品": 4, "保健機能食品": 3, "店舗販売業": 4, "配置販売業": 3, "情報提供": 4, "陳列": 4, "掲示": 3, "医薬品の広告": 4, "販売方法": 4, "その他の法令": 1, "監督処分": 4, "濫用等のおそれのある医薬品": 2, "かぜ薬": 4, "解熱鎮痛薬": 4, "眠気防止薬": 4, "睡眠改善薬": 3, "鎮暈薬": 4, "鎮咳去痰薬": 4, "胃腸薬": 4, "瀉下薬": 2, "浣腸薬": 2, "強心薬": 4, "高コレステロール改善薬": 4, "貧血用薬": 4, "痔疾用薬": 4, "泌尿器用薬": 3, "アレルギー用薬": 3, "鼻に用いる薬": 4, "眼科用薬": 4, "外皮用薬": 4, "消毒薬": 4, "殺虫剤・忌避剤": 4, "妊娠検査薬": 4, "禁煙補助剤": 4, "漢方処方製剤": 4, "生薬": 4, "止瀉薬": 3, "歯痛薬": 4, "一般用検査薬": 4, "添付文書": 4, "使用上の注意": 4, "保管・取扱い": 1, "使用しないこと": 4, "相談すること": 4, "事例問題": 4, "安全性情報": 4, "報告制度": 4, "企業報告": 4, "救済制度": 4, "啓発活動": 3, "PLセンター": 1, "口腔咽喉薬": 2, "婦人薬": 2, "滋養強壮保健薬": 2};

</script>
<script>
(function(){
'use strict';
var KEY='touhan-seigo-chiba-v1';
var SJ={}; SUBJECTS.forEach(function(s){SJ[s.id]=s;});
var cntBy={};
var QS=RAW.map(function(r){
  cntBy[r[0]]=(cntBy[r[0]]||0)+1;
  return {id:r[0]+'-'+cntBy[r[0]], s:r[0], t:r[1], q:r[2], a:r[3], e:r[4], f:(typeof FREQ!=='undefined'&&FREQ[r[1]])||1};
});
var $app=document.getElementById('app');
var $modal=document.getElementById('modal');
var $mbox=document.getElementById('modal-box');

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeGet(k,f){try{var v=localStorage.getItem(k);return v!==null?JSON.parse(v):f;}catch(e){return f;}}
function safeSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var store=safeGet(KEY,{q:{}}); if(!store||typeof store!=='object'||!store.q){store={q:{}};}
function save(){safeSet(KEY,store);}
function rec(id,ok){var r=store.q[id]||(store.q[id]={c:0,w:0,l:-1}); if(ok){r.c++;}else{r.w++;} r.l=ok?1:0;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function qsOf(sid){return QS.filter(function(q){return q.s===sid;});}
function stat(list){
  var c=0,w=0,seen=0,mastered=0,weak=0;
  list.forEach(function(q){var r=store.q[q.id]; if(r){c+=r.c;w+=r.w;seen++; if(r.l===1)mastered++; if(r.l===0)weak++;}});
  return {total:list.length,seen:seen,mastered:mastered,weak:weak,c:c,w:w,rate:(c+w)?Math.round(c/(c+w)*100):null};
}
function freqBadge(f){
  if(f>=4)return '<span class="pill hot">★頻出 4/4年</span>';
  if(f===3)return '<span class="pill warm">よく出る 3/4年</span>';
  if(f===2)return '<span class="pill warm">2/4年</span>';
  return '';
}
function weakList(){return QS.filter(function(q){var r=store.q[q.id];return r&&r.l===0;});}

/* ---------- modal (no confirm/alert) ---------- */
function showModal(title,body,buttons){
  var h='<div class="t">'+esc(title)+'</div><div>'+body+'</div><div class="bs">';
  buttons.forEach(function(b){h+='<button class="btn '+(b.cls||'')+'" data-act="'+b.act+'" data-arg="'+esc(b.arg||'')+'">'+esc(b.label)+'</button>';});
  h+='</div>';
  $mbox.innerHTML=h; $modal.classList.add('on');
}
function hideModal(){$modal.classList.remove('on');}

/* ---------- state ---------- */
var Z=null; // current quiz
var P=null; // 練習の出題プール {pool,pos,label}
var SET=10;  // 1セットの問題数
var GROUPS={iyaku:[
 ['かぜ・解熱鎮痛・眠気・めまい',['かぜ薬','解熱鎮痛薬','眠気防止薬','睡眠改善薬','鎮暈薬']],
 ['咳・のど・鼻・アレルギー',['鎮咳去痰薬','口腔咽喉薬','アレルギー用薬','鼻に用いる薬']],
 ['胃腸・便通',['胃腸薬','止瀉薬','瀉下薬','浣腸薬']],
 ['心臓・血液・痔',['強心薬','高コレステロール改善薬','貧血用薬','痔疾用薬']],
 ['泌尿器・婦人・滋養強壮',['泌尿器用薬','婦人薬','滋養強壮保健薬']],
 ['漢方・生薬',['漢方処方製剤','生薬']],
 ['眼・皮膚・歯・禁煙',['眼科用薬','外皮用薬','歯痛薬','禁煙補助剤']],
 ['消毒・殺虫・検査薬',['消毒薬','殺虫剤・忌避剤','一般用検査薬','妊娠検査薬']]
]};
var timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}

/* ---------- screens ---------- */
function renderHome(){
  stopTimer(); Z=null;
  var all=stat(QS), wk=weakList().length;
  var h='<h1>登録販売者 正誤トレーニング</h1><p class="lead">千葉ブロック受験用 ・ 全'+QS.length+'問 ・ ○か✕かで答えて、解説で確認</p>';
  h+='<div class="card"><div class="row between"><div><div class="sub">これまでの正答率</div><div class="big">'+(all.rate===null?'--':all.rate+'%')+'</div></div>'
    +'<div style="text-align:right"><div class="sub">習得済み</div><div class="big">'+all.mastered+'<span class="sub"> / '+all.total+'</span></div></div></div></div>';
  h+='<div class="sub" style="margin:4px 2px 8px">科目別に練習</div>';
  SUBJECTS.forEach(function(s){
    var st=stat(qsOf(s.id)), pct=st.total?Math.round(st.mastered/st.total*100):0;
    h+='<button class="subj" style="--c:'+s.color+'" data-act="subj" data-arg="'+s.id+'">'
      +'<div class="nm">'+esc(s.short)+' <span class="sub">'+esc(s.name===s.short?'':'')+'</span></div>'
      +'<div class="bar" style="--c:'+s.color+'"><i style="width:'+pct+'%"></i></div>'
      +'<div class="sub">'+st.total+'問 ・ 習得 '+st.mastered+' ・ 苦手 '+st.weak+' ・ 正答率 '+(st.rate===null?'--':st.rate+'%')+'</div></button>';
  });
  h+='<button class="btn" data-act="weak"'+(wk?'':' disabled')+'>苦手問題を復習する('+wk+'問)</button>';
  h+='<button class="btn ghost" data-act="mock">本番形式の模擬試験</button>';
  h+='<button class="btn gray" data-act="stats">成績を見る</button>';
  h+='<p class="note">※ 問題は千葉県の過去問の出題論点をもとにしたオリジナル問題です。「頻出」は、千葉県の令和4〜7年度の4年間で、そのテーマが何年出題されたかを示します。法改正や試験問題の手引きの改訂で内容が変わることがあるため、本番前に最新の手引き・千葉県の公式情報で確認してください。</p>';
  $app.innerHTML=h; window.scrollTo(0,0);
}

function renderSubject(sid){
  var s=SJ[sid], list=qsOf(sid), st=stat(list);
  var unseen=list.filter(function(q){return !store.q[q.id];}).length;
  var h='<div class="topbar"><button class="xbtn" data-act="home">‹ もどる</button><span class="pill" style="background:'+s.color+'22;color:'+s.color+'">'+esc(s.short)+'</span></div>';
  h+='<h1>'+esc(s.name)+'</h1><p class="lead">全'+st.total+'問 ・ 習得 '+st.mastered+' ・ 苦手 '+st.weak+' ・ 未回答 '+unseen+' ・ 正答率 '+(st.rate===null?'--':st.rate+'%')+'</p>';
  var hot=list.filter(function(q){return q.f>=4;}).length;
  h+='<button class="btn" data-act="start" data-arg="'+sid+':hot"'+(hot?'':' disabled')+'>頻出テーマだけ解く('+hot+'問)</button>';
  var nextOrder=list.filter(function(q){return !store.q[q.id];}).length;
  h+='<button class="btn" data-act="topics" data-arg="'+sid+'">テーマ別に解く</button>';
  h+='<button class="btn" data-act="start" data-arg="'+sid+':order">'+(nextOrder&&nextOrder<list.length?'順番に解く(続きから)':'順番に解く')+'</button>';
  h+='<button class="btn" data-act="start" data-arg="'+sid+':random">ランダムに解く</button>';
  h+='<button class="btn ghost" data-act="start" data-arg="'+sid+':unseen"'+(unseen?'':' disabled')+'>未回答だけ解く('+unseen+'問)</button>';
  h+='<button class="btn ghost" data-act="start" data-arg="'+sid+':weak"'+(st.weak?'':' disabled')+'>苦手だけ解く('+st.weak+'問)</button>';
  $app.innerHTML=h; window.scrollTo(0,0);
}

function topicRow(sid,label,list){
  var st=stat(list), unseen=list.filter(function(q){return !store.q[q.id];}).length;
  var f=Math.max.apply(null,list.map(function(q){return q.f;}));
  return '<button class="btn ghost" style="text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px" data-act="tstart" data-arg="'+esc(sid+'|t|'+label)+'"><span>'+esc(label)+(f>=4?' <span style="color:#9a6a00">★</span>':'')+'</span><small>'+list.length+'問・苦手'+st.weak+'・未'+unseen+'</small></button>';
}
function renderTopics(sid){
  var s=SJ[sid], list=qsOf(sid);
  var by={}, order=[];
  list.forEach(function(q){ if(!by[q.t]){by[q.t]=[];order.push(q.t);} by[q.t].push(q); });
  var h='<div class="topbar"><button class="xbtn" data-act="subj" data-arg="'+sid+'">‹ もどる</button><span class="pill" style="background:'+s.color+'22;color:'+s.color+'">'+esc(s.short)+'</span></div>';
  h+='<h1>テーマ別に解く</h1><p class="lead">テーマを選ぶと、そのテーマの問題を10問ずつ出題します。★は頻出テーマです。</p>';
  var used={}, groups=GROUPS[sid];
  if(groups){
    groups.forEach(function(g,gi){
      var labels=g[1].filter(function(t){return by[t];});
      if(!labels.length)return;
      var gl=[]; labels.forEach(function(t){used[t]=1; gl=gl.concat(by[t]);});
      h+='<div class="sub" style="margin:16px 0 6px;font-weight:700">'+esc(g[0])+'</div>';
      h+='<button class="btn" data-act="tstart" data-arg="'+esc(sid+'|g|'+gi)+'">このグループをまとめて解く('+gl.length+'問)</button>';
      labels.forEach(function(t){h+=topicRow(sid,t,by[t]);});
    });
    var rest=order.filter(function(t){return !used[t];});
    if(rest.length){h+='<div class="sub" style="margin:16px 0 6px;font-weight:700">その他</div>'; rest.forEach(function(t){h+=topicRow(sid,t,by[t]);});}
  } else {
    order.forEach(function(t){h+=topicRow(sid,t,by[t]);});
  }
  $app.innerHTML=h; window.scrollTo(0,0);
}

function startPractice(pool,label){
  P={pool:pool,pos:0,label:label};
  startSet();
}
function startSet(){
  var chunk=P.pool.slice(P.pos,P.pos+SET);
  startQuiz('practice',chunk,P.label+' '+(P.pos+1)+'〜'+(P.pos+chunk.length)+'問目/全'+P.pool.length+'問');
}
function startQuiz(mode,list,label){
  stopTimer();
  Z={mode:mode,list:list,i:0,ans:[],label:label};
  if(mode==='mock'){
    Z.deadline=Date.now()+list.length*2*60*1000; // 本番は1問あたり約2分
    timerId=setInterval(tick,1000);
  }
  renderQuiz();
}
function tick(){
  if(!Z||Z.mode!=='mock'){stopTimer();return;}
  var left=Math.max(0,Z.deadline-Date.now());
  var el=document.getElementById('timer');
  if(el){var tot=Math.floor(left/1000),hh=Math.floor(tot/3600),mm=Math.floor(tot%3600/60),ss=tot%60;
    el.textContent=(hh?hh+':':'')+('0'+mm).slice(-2)+':'+('0'+ss).slice(-2);}
  if(left<=0){stopTimer();finishMock(true);}
}

function renderQuiz(){
  var q=Z.list[Z.i], s=SJ[q.s], n=Z.list.length, a=Z.ans[Z.i], mock=Z.mode==='mock';
  var h='<div class="topbar"><button class="xbtn" data-act="quitAsk">✕ 中断</button>'
    +'<span class="sub">'+(Z.mode==='mock'?esc(Z.label)+' ':'')+(Z.i+1)+' / '+n+(Z.mode!=='mock'&&P&&P.pool.length>SET?'(全'+P.pool.length+'問中 '+(P.pos+Z.i+1)+'問目)':'')+'</span>'
    +(mock?'<span class="timer" id="timer">--:--</span>':'<span></span>')+'</div>';
  h+='<div class="bar" style="--c:'+s.color+';margin-top:0"><i style="width:'+Math.round(Z.i/n*100)+'%"></i></div>';
  h+='<div class="card"><div class="q-meta"><span class="pill" style="background:'+s.color+'22;color:'+s.color+'">'+esc(s.short)+'</span><span class="pill">'+esc(q.t)+'</span>'+freqBadge(q.f)+'</div>';
  h+='<p class="q-text">'+esc(q.q)+'</p>';
  var locked=(!mock&&a);
  function cls(v){
    if(!a) return '';
    if(mock) return a.pick===v?'pick':'';
    if(v===q.a) return 'right';
    if(a.pick===v) return 'wrong';
    return '';
  }
  h+='<div class="ans"><button class="'+cls(1)+'" data-act="ans" data-arg="1"'+(locked?' disabled':'')+'>○<small>正しい</small></button>'
    +'<button class="'+cls(0)+'" data-act="ans" data-arg="0"'+(locked?' disabled':'')+'>✕<small>誤り</small></button></div>';
  if(!mock&&a){
    var ok=a.pick===q.a;
    h+='<div class="fb '+(ok?'ok':'ng')+'"><b class="h">'+(ok?'⭕ 正解!':'❌ 不正解')+'　答え:'+(q.a?'○ 正しい':'✕ 誤り')+'</b>'+esc(q.e)+'</div>';
  }
  h+='</div>';
  var last=Z.i===n-1;
  if(mock){
    h+='<div class="row">';
    if(Z.i>0){h+='<button class="btn gray" style="margin-top:0" data-act="prev">‹ 前へ</button>';}
    h+='<button class="btn" style="margin-top:0" data-act="next"'+(a?'':' disabled')+'>'+(last?'採点する':'次へ ›')+'</button></div>';
  }else{
    h+='<button class="btn" data-act="next"'+(a?'':' disabled')+'>'+(last?'結果を見る':'次の問題 ›')+'</button>';
  }
  $app.innerHTML=h; window.scrollTo(0,0);
  if(mock)tick();
}

function answer(v){
  var q=Z.list[Z.i];
  if(Z.mode==='mock'){Z.ans[Z.i]={pick:v};}
  else{
    if(Z.ans[Z.i])return;
    Z.ans[Z.i]={pick:v};
    rec(q.id,v===q.a); save();
  }
  renderQuiz();
}

function next(){
  if(!Z.ans[Z.i])return;
  if(Z.i<Z.list.length-1){Z.i++;renderQuiz();}
  else{ if(Z.mode==='mock'){finishMock(false);}else{finishPractice();} }
}

function reviewHTML(items){
  if(!items.length)return '<div class="card" style="text-align:center">全問正解です 🎉</div>';
  var h='<div class="card"><div class="sub" style="margin-bottom:4px">間違えた問題('+items.length+'問)</div>';
  items.forEach(function(it){
    var q=it.q;
    h+='<div class="rev"><span class="pill">'+esc(SJ[q.s].short+' / '+q.t)+'</span><div style="margin:6px 0">'+esc(q.q)+'</div>'
      +'<div class="a">あなたの答え:'+(it.pick===null?'未回答':(it.pick?'○':'✕'))+' → 正解:<b class="tag-ok">'+(q.a?'○ 正しい':'✕ 誤り')+'</b></div>'
      +'<div style="margin-top:4px">'+esc(q.e)+'</div></div>';
  });
  return h+'</div>';
}

function finishPractice(){
  var n=Z.list.length, ok=0, wrong=[];
  Z.list.forEach(function(q,i){var a=Z.ans[i]; if(a&&a.pick===q.a){ok++;}else{wrong.push({q:q,pick:a?a.pick:null});}});
  var pct=Math.round(ok/n*100);
  var h='<h1>結果</h1><div class="card" style="text-align:center"><div class="sub">'+esc(Z.label)+'</div><div class="big" style="font-size:40px;margin:6px 0">'+ok+' / '+n+'</div><div class="sub">正答率 '+pct+'%</div></div>';
  h+=reviewHTML(wrong);
  var more=P&&(P.pos+SET<P.pool.length);
  if(more){h+='<button class="btn" data-act="nextset">次の10問へ('+Math.min(SET,P.pool.length-P.pos-SET)+'問)</button>';}
  else if(P){h+='<div class="sub" style="text-align:center;margin:10px 0">この出題メニューは最後まで解きました</div>';}
  h+='<button class="btn gray" data-act="home">ホームにもどる</button>';
  Z=null; $app.innerHTML=h; window.scrollTo(0,0);
}

function buildMock(){
  var list=[];
  SUBJECTS.forEach(function(s){
    var pool=shuffle(qsOf(s.id));
    list=list.concat(pool.slice(0,Math.min(s.exam,pool.length)));
  });
  return list;
}

function finishMock(timeUp){
  stopTimer();
  var per={}, wrong=[], okAll=0;
  SUBJECTS.forEach(function(s){per[s.id]={n:0,ok:0};});
  Z.list.forEach(function(q,i){
    var a=Z.ans[i], pick=a?a.pick:null, ok=(pick===q.a);
    per[q.s].n++; if(ok){per[q.s].ok++;okAll++;}else{wrong.push({q:q,pick:pick});}
    if(a){rec(q.id,ok);}
  });
  save();
  var n=Z.list.length, pct=Math.round(okAll/n*100);
  var floorOK=SUBJECTS.every(function(s){return per[s.id].n===0||per[s.id].ok/per[s.id].n>=0.35;});
  var pass=(pct>=70&&floorOK);
  var h='<h1>模擬試験の結果</h1>';
  if(timeUp)h+='<p class="lead" style="color:var(--ng)">時間切れで終了しました(未回答は不正解扱い)</p>';
  h+='<div class="card" style="text-align:center"><div class="big" style="font-size:40px">'+okAll+' / '+n+'</div><div class="sub">得点率 '+pct+'%</div>'
    +'<div style="margin-top:8px;font-weight:700;font-size:18px" class="'+(pass?'tag-ok':'tag-ng')+'">'+(pass?'合格ライン到達 🎉':'合格ライン未達')+'</div>'
    +'<div class="note" style="margin-top:6px">合格の目安:全体70%以上 かつ 各科目35%以上</div></div>';
  h+='<div class="card"><table><tr><th>科目</th><th>得点</th><th>得点率</th><th>35%</th></tr>';
  SUBJECTS.forEach(function(s){
    var p=per[s.id], r=p.n?Math.round(p.ok/p.n*100):0, f=p.n?(p.ok/p.n>=0.35):true;
    h+='<tr><td>'+esc(s.short)+'</td><td>'+p.ok+' / '+p.n+'</td><td>'+r+'%</td><td class="'+(f?'tag-ok':'tag-ng')+'">'+(f?'OK':'NG')+'</td></tr>';
  });
  h+='</table></div>';
  h+=reviewHTML(wrong);
  h+='<button class="btn" data-act="home">ホームにもどる</button>';
  Z=null; $app.innerHTML=h; window.scrollTo(0,0);
}

function renderStats(){
  var h='<div class="topbar"><button class="xbtn" data-act="home">‹ もどる</button><span></span></div><h1>成績</h1>';
  h+='<div class="card"><table><tr><th>科目</th><th>問題数</th><th>習得</th><th>苦手</th><th>正答率</th></tr>';
  var tot=stat(QS);
  SUBJECTS.forEach(function(s){
    var st=stat(qsOf(s.id));
    h+='<tr><td>'+esc(s.short)+'</td><td>'+st.total+'</td><td>'+st.mastered+'</td><td>'+st.weak+'</td><td>'+(st.rate===null?'--':st.rate+'%')+'</td></tr>';
  });
  h+='<tr><td><b>合計</b></td><td><b>'+tot.total+'</b></td><td><b>'+tot.mastered+'</b></td><td><b>'+tot.weak+'</b></td><td><b>'+(tot.rate===null?'--':tot.rate+'%')+'</b></td></tr></table></div>';
  h+='<p class="note">習得=直近の回答が正解の問題 / 苦手=直近の回答が不正解の問題 / 正答率=これまでの全回答の正解率</p>';
  h+='<button class="btn gray" data-act="resetAsk">成績をリセットする</button>';
  $app.innerHTML=h; window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-act]'):null; if(!el)return;
  var act=el.getAttribute('data-act'), arg=el.getAttribute('data-arg')||'';
  switch(act){
    case 'home': hideModal(); renderHome(); break;
    case 'subj': renderSubject(arg); break;
    case 'start':
      var p=arg.split(':'), sid=p[0], mode=p[1], list=qsOf(sid);
      if(mode==='order'){var fi=-1; for(var k=0;k<list.length;k++){if(!store.q[list[k].id]){fi=k;break;}} if(fi>0){list=list.slice(fi);}}
      else if(mode==='random'){list=shuffle(list);}
      else if(mode==='hot'){list=shuffle(list.filter(function(q){return q.f>=4;}));}
      else if(mode==='unseen'){list=shuffle(list.filter(function(q){return !store.q[q.id];}));}
      else if(mode==='weak'){list=shuffle(list.filter(function(q){var r=store.q[q.id];return r&&r.l===0;}));}
      if(!list.length){break;}
      startPractice(list,SJ[sid].short); break;
    case 'topics': renderTopics(arg); break;
    case 'tstart':
      var tp=arg.split('|'), tl;
      if(tp[1]==='t'){ tl=qsOf(tp[0]).filter(function(q){return q.t===tp[2];}); startPractice(shuffle(tl),tp[2]); }
      else { var g=GROUPS[tp[0]][parseInt(tp[2],10)]; tl=qsOf(tp[0]).filter(function(q){return g[1].indexOf(q.t)>=0;}); startPractice(shuffle(tl),g[0]); }
      break;
    case 'nextset': if(P){P.pos+=SET; startSet();} break;
    case 'weak':
      var wl=weakList(); if(!wl.length)break;
      startPractice(shuffle(wl),'苦手復習'); break;
    case 'mock':
      showModal('模擬試験を始めますか?','各科目から本番の配分でランダムに出題します(最大'+SUBJECTS.reduce(function(a,s){return a+Math.min(s.exam,qsOf(s.id).length);},0)+'問)。<br>制限時間は1問あたり2分。解説は終了後にまとめて表示します。',
        [{label:'やめる',act:'modalClose',cls:'gray'},{label:'始める',act:'mockGo'}]); break;
    case 'mockGo': hideModal(); startQuiz('mock',buildMock(),'模擬試験'); break;
    case 'stats': renderStats(); break;
    case 'ans': if(Z)answer(parseInt(arg,10)); break;
    case 'next': if(Z)next(); break;
    case 'prev': if(Z&&Z.i>0){Z.i--;renderQuiz();} break;
    case 'quitAsk':
      showModal('中断しますか?',Z&&Z.mode==='mock'?'模擬試験は採点されずに終了します。':'ここまでの回答は記録されています。',
        [{label:'続ける',act:'modalClose',cls:'gray'},{label:'中断する',act:'home'}]); break;
    case 'modalClose': hideModal(); break;
    case 'resetAsk':
      showModal('成績をリセットしますか?','回答履歴・正答率がすべて消えます。元に戻せません。',
        [{label:'やめる',act:'modalClose',cls:'gray'},{label:'リセット',act:'resetGo'}]); break;
    case 'resetGo': store={q:{}}; save(); hideModal(); renderHome(); break;
  }
});

renderHome();
})();
</script>
